services:

  - type: web
    name: english-shadowing-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: english-shadowing-db
          property: connectionString

      - key: SECRET_KEY
        sync: false

    healthCheckPath: /health


  - type: web
    name: english-shadowing-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

    envVars:
      - key: VITE_API_URL
        value: https://english-shadowing-backend.onrender.com


databases:

  - name: english-shadowing-db
    plan: free
    databaseName: english_shadowing
    user: english_shadowing