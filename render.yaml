services:
  - type: web
    name: freeenglishhub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/app.db

      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ORIGINS
        sync: false