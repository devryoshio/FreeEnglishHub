services:
  - type: web
    name: freeenglishhub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/app.db

      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ORIGINS
        sync: false

    disk:
      name: freeenglishhub-data
      mountPath: /app/data
      sizeGB: 1

  - type: web
    name: freeenglishhub-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

    envVars:
      - key: VITE_API_URL
        sync: false